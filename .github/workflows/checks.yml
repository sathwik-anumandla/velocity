name: Build and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_usage_recovery.py'
      - run: python -m unittest discover -s tests -p 'test_history.py'
      - run: python -m unittest discover -s tests -p 'test_google_tools.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: docker build --build-arg APP_REVISION=${{ github.sha }} -t velocity-check .
